<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="blushGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE8E6" />
      <stop offset="60%" stop-color="#F7D0CC" />
      <stop offset="100%" stop-color="#EDB8B2" />
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F2B8B1" stop-opacity="0.85" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#C8827A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Pill/Circle -->
  <rect width="64" height="64" rx="18" fill="url(#blushGlow)" />

  <!-- 5-Petal Gentle Bloom -->
  <g transform="translate(32,32)" filter="url(#softShadow)">
    <circle cx="0" cy="-11" r="7.5" fill="url(#petalGrad)"/>
    <circle cx="10.5" cy="-3.5" r="7.5" fill="url(#petalGrad)"/>
    <circle cx="6.5" cy="9" r="7.5" fill="url(#petalGrad)"/>
    <circle cx="-6.5" cy="9" r="7.5" fill="url(#petalGrad)"/>
    <circle cx="-10.5" cy="-3.5" r="7.5" fill="url(#petalGrad)"/>
    
    <!-- Floral Center -->
    <circle cx="0" cy="0" r="4.5" fill="#E89B92"/>
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF"/>
    
    <!-- Central Delicate Sparkle -->
    <path d="M0 -3 L0.8 -0.8 L3 0 L0.8 0.8 L0 3 L-0.8 0.8 L-3 0 L-0.8 -0.8 Z" fill="#6B4F4B"/>
  </g>
</svg>
