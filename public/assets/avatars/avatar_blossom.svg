<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0EE" />
      <stop offset="100%" stop-color="#F9D2CE" />
    </radialGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFCCD5" />
      <stop offset="100%" stop-color="#F4978E" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#C8827A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="24" fill="url(#bgGlow)"/>
  <g transform="translate(40,40)" filter="url(#softShadow)">
    <circle cx="0" cy="-14" r="10" fill="url(#pGrad)"/>
    <circle cx="13" cy="-4" r="10" fill="url(#pGrad)"/>
    <circle cx="8" cy="11" r="10" fill="url(#pGrad)"/>
    <circle cx="-8" cy="11" r="10" fill="url(#pGrad)"/>
    <circle cx="-13" cy="-4" r="10" fill="url(#pGrad)"/>
    <circle cx="0" cy="0" r="5" fill="#E27396"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <circle cx="2" cy="-2" r="1" fill="#FFF" opacity="0.9"/>
  </g>
</svg>
