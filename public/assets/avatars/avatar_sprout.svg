<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="sproutBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3F9F4" />
      <stop offset="100%" stop-color="#DCEEE0" />
    </radialGradient>
    <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2E7CA" />
      <stop offset="60%" stop-color="#7CB388" />
      <stop offset="100%" stop-color="#558B62" />
    </linearGradient>
    <linearGradient id="leafGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7F2DC" />
      <stop offset="60%" stop-color="#8DC698" />
      <stop offset="100%" stop-color="#629E6E" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#EBE3D9" />
      <stop offset="100%" stop-color="#D6CBBD" />
    </linearGradient>
    <filter id="sproutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#72977B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="24" fill="url(#sproutBg)"/>
  <g transform="translate(40,42)" filter="url(#sproutShadow)">
    <!-- Little ceramic planter -->
    <path d="M-12 8 L12 8 L9 20 L-9 20 Z" fill="url(#potGrad)"/>
    <ellipse cx="0" cy="8" rx="12" ry="3" fill="#DFD6C8"/>
    <!-- Stem -->
    <path d="M0 8 Q0 0 1 -10" stroke="#558B62" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Left Leaf -->
    <path d="M0 -4 C-8 -7 -14 -3 -15 -12 C-9 -14 -4 -10 0 -4 Z" fill="url(#leafGradLeft)"/>
    <!-- Right Leaf -->
    <path d="M1 -9 C9 -12 15 -8 16 -17 C10 -19 5 -15 1 -9 Z" fill="url(#leafGradRight)"/>
    <!-- Glass Dew drop -->
    <circle cx="-9" cy="-8" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
