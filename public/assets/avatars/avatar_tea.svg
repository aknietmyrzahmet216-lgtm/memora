<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="teaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7F6F2" />
      <stop offset="100%" stop-color="#E7E5DC" />
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EBE8DE" />
      <stop offset="100%" stop-color="#C5BEAE" />
    </linearGradient>
    <linearGradient id="teaLiquor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5C492" />
      <stop offset="100%" stop-color="#73975C" />
    </linearGradient>
    <filter id="teaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8F8B7B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="24" fill="url(#teaBg)"/>
  <g transform="translate(40,42)" filter="url(#teaShadow)">
    <!-- Steam swirls -->
    <path d="M-6 -18 Q-2 -24 -6 -28" stroke="#D1CDC2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M4 -16 Q8 -22 4 -26" stroke="#D1CDC2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Cup body -->
    <path d="M-16 -8 C-16 12 -12 20 0 20 C12 20 16 12 16 -8 Z" fill="url(#cupGrad)"/>
    <!-- Cup Rim & Tea surface -->
    <ellipse cx="0" cy="-8" rx="16" ry="6" fill="#D3CCA8"/>
    <ellipse cx="0" cy="-7" rx="14" ry="4.5" fill="url(#teaLiquor)"/>
    <!-- Floating cherry petal on tea -->
    <ellipse cx="2" cy="-7" rx="3.5" ry="2" fill="#F4A6B6" transform="rotate(-15 2 -7)"/>
    <!-- Glaze sheen -->
    <path d="M-13 -4 C-14 4 -10 14 -3 18" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
