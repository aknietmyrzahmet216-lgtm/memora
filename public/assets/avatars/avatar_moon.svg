<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="moonBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF7EE" />
      <stop offset="100%" stop-color="#EFE6D2" />
    </radialGradient>
    <linearGradient id="goldMoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="40%" stop-color="#F3DC9B" />
      <stop offset="100%" stop-color="#D4AC50" />
    </linearGradient>
    <radialGradient id="pearlStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7D897" />
    </radialGradient>
    <filter id="moonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#B2985B" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="24" fill="url(#moonBg)"/>
  <g transform="translate(40,40)" filter="url(#moonShadow)">
    <!-- Crescent Moon -->
    <path d="M-4 -18 C-14 -18 -22 -10 -22 2 C-22 14 -14 22 -2 22 C-1 22 2 21 5 19 C-4 17 -11 9 -11 2 C-11 -5 -4 -13 5 -15 C2 -17 -1 -18 -4 -18 Z" fill="url(#goldMoon)"/>
    <!-- Small star 1 -->
    <path d="M12 -8 L13 -4 L17 -3 L13 -2 L12 2 L11 -2 L7 -3 L11 -4 Z" fill="url(#pearlStar)"/>
    <!-- Small star 2 -->
    <path d="M16 10 L17 12 L19 13 L17 14 L16 16 L15 14 L13 13 L15 12 Z" fill="url(#pearlStar)" transform="scale(0.8) translate(4, 2)"/>
    <!-- Sparkle dot -->
    <circle cx="6" cy="-2" r="1.5" fill="#FFF" opacity="0.9"/>
  </g>
</svg>
