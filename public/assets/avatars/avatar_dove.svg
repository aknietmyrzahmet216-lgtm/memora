<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="doveBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF7F5" />
      <stop offset="100%" stop-color="#EBE3DE" />
    </radialGradient>
    <linearGradient id="doveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F5EFEA" />
      <stop offset="100%" stop-color="#DFD5CE" />
    </linearGradient>
    <filter id="doveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#A5958C" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="24" fill="url(#doveBg)"/>
  <g transform="translate(38,40)" filter="url(#doveShadow)">
    <!-- Back wing -->
    <path d="M-6 -2 C-10 -16 -2 -22 6 -20 C2 -12 2 -5 -2 0 Z" fill="#E6DDD6" opacity="0.8"/>
    <!-- Tail -->
    <path d="M-14 12 C-20 16 -24 14 -22 10 C-18 6 -12 8 -8 9 Z" fill="url(#doveGrad)"/>
    <!-- Body -->
    <path d="M-10 10 C-12 2 -4 -6 6 -6 C14 -6 18 2 12 12 C4 18 -6 16 -10 10 Z" fill="url(#doveGrad)"/>
    <!-- Front wing -->
    <path d="M-2 4 C-8 -12 4 -20 12 -16 C8 -8 4 0 0 8 Z" fill="url(#doveGrad)"/>
    <!-- Head -->
    <circle cx="14" cy="-4" r="5" fill="url(#doveGrad)"/>
    <!-- Beak -->
    <polygon points="18,-5 23,-3 18,-2" fill="#D4A373"/>
    <!-- Eye -->
    <circle cx="15" cy="-5" r="0.9" fill="#3D2E2B"/>
    <!-- Olive sprig in beak -->
    <path d="M22 -2 Q26 -6 28 -4" stroke="#7A9A7B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="-4" r="1.5" fill="#7A9A7B"/>
  </g>
</svg>
