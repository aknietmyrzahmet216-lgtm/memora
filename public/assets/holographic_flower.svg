<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="70" height="70">
  <defs>
    <linearGradient id="holoStem" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4C1F9" />
      <stop offset="50%" stop-color="#A9DEF9" />
      <stop offset="100%" stop-color="#D0F4DE" />
    </linearGradient>
    <linearGradient id="holoPetal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5D9" />
      <stop offset="35%" stop-color="#FFCAD4" />
      <stop offset="70%" stop-color="#B5E2FA" />
      <stop offset="100%" stop-color="#F3C4FB" />
    </linearGradient>
    <linearGradient id="holoPetal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE2E4" />
      <stop offset="50%" stop-color="#E2ECE9" />
      <stop offset="100%" stop-color="#DFCCF1" />
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE5EC" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#sparkleGlow)" opacity="0.6" />

  <!-- Elegant curved metallic stem -->
  <path d="M45 88 Q40 68 50 48" fill="none" stroke="url(#holoStem)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Delicate sweeping leaf -->
  <path d="M44 76 Q30 70 24 55 Q36 60 45 70" fill="url(#holoPetal2)" opacity="0.85" />
  <path d="M47 66 Q65 62 72 48 Q60 55 48 62" fill="url(#holoPetal1)" opacity="0.85" />

  <!-- Sculptural 3D Tulip / Rose Bloom -->
  <g filter="url(#softGlow)">
    <!-- Back center petal -->
    <path d="M50 46 C42 34 46 22 50 18 C54 22 58 34 50 46 Z" fill="url(#holoPetal2)" opacity="0.9" />
    <!-- Left wrap petal -->
    <path d="M48 48 C36 44 32 30 42 22 C48 28 50 38 48 48 Z" fill="url(#holoPetal1)" opacity="0.95" />
    <!-- Right wrap petal -->
    <path d="M52 48 C64 44 68 30 58 22 C52 28 50 38 52 48 Z" fill="url(#holoPetal1)" opacity="0.95" />
    <!-- Front cup petal -->
    <path d="M44 45 C48 50 52 50 56 45 C58 36 54 28 50 26 C46 28 42 36 44 45 Z" fill="url(#holoPetal2)" opacity="0.9" />
  </g>

  <!-- Sparkles -->
  <!-- Top Sparkle -->
  <path d="M26 24 Q29 27 32 27 Q29 27 26 30 Q26 27 23 27 Q26 27 26 24 Z" fill="#D4AF37" opacity="0.85" />
  <circle cx="26" cy="27" r="1" fill="#FFF" />

  <!-- Right Sparkle -->
  <path d="M74 38 Q77 41 80 41 Q77 41 74 44 Q74 41 71 41 Q74 41 74 38 Z" fill="#E4C1F9" opacity="0.85" />
  <circle cx="74" cy="41" r="1.2" fill="#FFF" />

  <!-- Tiny dots -->
  <circle cx="68" cy="22" r="1.5" fill="#FFE5D9" />
  <circle cx="34" cy="45" r="1" fill="#A9DEF9" />
  <circle cx="48" cy="14" r="1.2" fill="#FFFFFF" />
</svg>
